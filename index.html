<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piecework: Flowers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a jigsaw table for Piecework. Two slim control rows, then one canvas filling the rest of the screen: the frame on top (or left, on wide screens) and loose pieces on the felt. Deliberately single-theme: a dark table makes every picture read. Flowers Edition: same engine as the Cityscape Edition, flower painters, petal accent. */
:root {
  --bg: #121719;
  --felt: #1d2f2b;
  --ink: #ebe6d8;
  --muted: #8e978f;
  --line: #2c3a37;
  --lamp: #f0a3a8;
  --display: "Big Shoulders Display", "Oswald", "Arial Narrow", sans-serif;
  --body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; background: var(--bg); color: var(--ink); }
body {
  font-family: var(--body);
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 10px 8px;
  box-sizing: border-box;
  display: flex; flex-direction: column; gap: 8px;
  -webkit-user-select: none; user-select: none;
}
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; max-width: 960px; width: 100%; margin: 0 auto; }
h1 { font-family: var(--display); font-weight: 800; font-size: 1.55rem; line-height: 1; margin: 0; text-transform: uppercase; letter-spacing: .02em; }
h1 span { color: var(--lamp); font-weight: 600; font-size: .62em; letter-spacing: .06em; white-space: nowrap; }
.status { font-size: .88rem; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 12px; align-items: baseline; }
.status b { color: var(--ink); font-weight: 700; }
.opts { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; max-width: 960px; width: 100%; margin: 0 auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: color-mix(in oklab, var(--felt) 50%, var(--bg)); }
.seg button { border: 0; background: transparent; color: var(--muted); font: 700 .8rem var(--body); padding: 6px 11px; cursor: pointer; font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.btn { border: 1px solid var(--lamp); background: transparent; color: var(--lamp); font: 700 .8rem var(--body); padding: 6px 13px; border-radius: 999px; cursor: pointer; touch-action: none; }
.btn.hold:active, .btn.hold.on { background: var(--lamp); color: var(--bg); }
.btn:focus-visible, .seg button:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.stage { flex: 1 1 auto; min-height: 360px; max-width: 960px; width: 100%; margin: 0 auto; position: relative; }
canvas#table { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; border-radius: 6px; cursor: grab; }
canvas#table.dragging { cursor: grabbing; }
footer { text-align: center; font-size: .78rem; }
footer a { color: var(--muted); font-style: italic; text-decoration: none; }
</style>
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { margin: 0; }
body { font-size: 14px; }
[hidden] { display: none !important; }
</style>
</head>
<body>

<div class="top">
  <h1>Piecework <span>Flowers Edition</span></h1>
  <div class="status" aria-live="polite"><span id="placed"></span><span id="clock">0:00</span><span id="peeks"></span></div>
</div>
<div class="opts">
  <div class="seg" role="group" aria-label="City"><button id="c-today" type="button" aria-pressed="true">Today</button><button id="c-random" type="button" aria-pressed="false">Random</button></div>
  <div class="seg" role="group" aria-label="Kind of picture"><button id="k-still" type="button" aria-pressed="true">Still life</button><button id="k-field" type="button" aria-pressed="false">Tulip fields</button></div>
  <div class="seg" role="group" aria-label="Fresh or later"><button id="t-night" type="button" aria-pressed="true">Fresh</button><button id="t-day" type="button" aria-pressed="false">Later</button></div>
  <div class="seg" role="group" aria-label="Piece orientation"><button id="m-up" type="button" aria-pressed="true">Upright</button><button id="m-turn" type="button" aria-pressed="false">Turned</button></div>
  <div class="seg" role="group" aria-label="Pieces" id="sizes"></div>
  <button class="btn hold" id="peek" type="button" aria-label="Hold to look at the box">Peek</button>
  <button class="btn" id="spread" type="button">Spread</button>
</div>
<div class="stage" id="stage"><canvas id="table" aria-label="Jigsaw table. Drag pieces into the frame."></canvas></div>
<footer><a href="https://steffenhuck.github.io" target="_blank" rel="noopener">steffen huck</a></footer>

<script>
const W = 1000, H = 750;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; }
function hexA(hex, a) { const [r, g, b] = rgb(hex); return `rgba(${r},${g},${b},${a})`; }
function mix(a, b, t) { const x = rgb(a), y = rgb(b); return '#' + x.map((v, i) => Math.max(0, Math.min(255, Math.round(v + (y[i] - v) * t))).toString(16).padStart(2, '0')).join(''); }
function shade(hex, f) { return mix(hex, f < 1 ? '#000000' : '#ffffff', f < 1 ? 1 - f : f - 1); }

// ================= STILL LIFE =================
const WALLS = [
  { name: 'umber', a: '#4a3828', b: '#1f160e' }, { name: 'sage', a: '#8d9a7b', b: '#56614a' },
  { name: 'dusty blue', a: '#6f839c', b: '#3a485a' }, { name: 'ochre', a: '#c09a58', b: '#7a5a2a' },
  { name: 'old rose', a: '#c08a84', b: '#7a4c48' }, { name: 'bottle green', a: '#3c5646', b: '#16241c' },
  { name: 'cream', a: '#e4d9c0', b: '#a8987a' }
];
const BOUQUETS = [
  { name: 'blush', c: ['#f2c4c9', '#e88fa0', '#fff3ec', '#c94f6d', '#f7dccd'] },
  { name: 'sunset', c: ['#f28c38', '#e94f37', '#f6c445', '#fff1d6', '#c73a2a'] },
  { name: 'cool', c: ['#6b7fd7', '#b8c4f2', '#ffffff', '#8e5fb8', '#d9d2f2'] },
  { name: 'meadow', c: ['#f6e27a', '#ffffff', '#e85d75', '#7aa9e0', '#f3a03c'] },
  { name: 'deep', c: ['#8e1f3d', '#c2304f', '#f2d0a9', '#5a2a5e', '#e07a5f'] },
  { name: 'white', c: ['#fbf8f0', '#efe8d8', '#f6e7a8', '#e8dcef', '#fff'] }
];
const VASES = [
  { name: 'blue glaze', c: '#2e5c8a' }, { name: 'porcelain', c: '#e9e6df', band: '#2a4d8f' }, { name: 'terracotta', c: '#b5653d' },
  { name: 'celadon', c: '#8fb3a0' }, { name: 'copper', c: '#b07040' }, { name: 'black', c: '#26282c' }, { name: 'glass', c: '#cfe3e0', glass: true }
];
const PROFILES = {
  bulb: [[0, .34], [.35, .5], [.7, .32], [.86, .17], [1, .22]],
  cylinder: [[0, .37], [.5, .38], [1, .4]],
  urn: [[0, .28], [.12, .26], [.5, .5], [.85, .3], [1, .4]],
  jug: [[0, .4], [.3, .48], [.75, .38], [.92, .33], [1, .38]],
  tumbler: [[0, .3], [1, .42]]
};
function profR(pts, t) {
  for (let i = 1; i < pts.length; i++) if (t <= pts[i][0]) {
    const [t0, r0] = pts[i - 1], [t1, r1] = pts[i], u = (t - t0) / (t1 - t0), e = u * u * (3 - 2 * u);
    return r0 + (r1 - r0) * e;
  }
  return pts[pts.length - 1][1];
}

function petal(ctx, x, y, len, wid, ang, col) {
  const c = Math.cos(ang), s = Math.sin(ang);
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(x, y);
  const tx = x + c * len, ty = y + s * len, nx = -s * wid, ny = c * wid;
  ctx.bezierCurveTo(x + c * len * .3 + nx, y + s * len * .3 + ny, x + c * len * .95 + nx * .8, y + s * len * .95 + ny * .8, tx, ty);
  ctx.bezierCurveTo(x + c * len * .95 - nx * .8, y + s * len * .95 - ny * .8, x + c * len * .3 - nx, y + s * len * .3 - ny, x, y);
  ctx.fill();
}

function drawFlower(ctx, f, age, rx) {
  const { x, y, size: s, col, type } = f;
  const keep = () => rx() > .32 * age * f.wilt; // petals that are still there
  const C = age ? mix(col, '#8a6a48', .22 + .3 * f.wilt * age) : col;
  const dk = shade(C, .78), lt = mix(C, '#ffffff', .25);
  const tilt = f.tilt + age * f.wilt * .5 * f.side;
  if (type === 'daisy') {
    const n = f.n;
    for (let i = 0; i < n; i++) if (keep()) petal(ctx, x, y, s * (age ? 1 - .25 * f.wilt : 1), s * .2, tilt + i * Math.PI * 2 / n + (age ? f.wilt * .5 : 0), i % 2 ? C : lt);
    ctx.fillStyle = age ? '#9a7a2a' : '#f2c230'; ctx.beginPath(); ctx.arc(x, y, s * .3, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(120,70,10,.35)'; ctx.beginPath(); ctx.arc(x + s * .05, y + s * .06, s * .2, 0, 7); ctx.fill();
  } else if (type === 'poppy' || type === 'anemone') {
    const n = type === 'poppy' ? 4 : 6;
    for (let i = 0; i < n; i++) if (keep()) petal(ctx, x, y, s * .95, s * .62, tilt + i * Math.PI * 2 / n, i % 2 ? C : dk);
    ctx.fillStyle = type === 'poppy' ? '#2a1e22' : '#1e1f2e'; ctx.beginPath(); ctx.arc(x, y, s * .24, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(30,30,40,.7)';
    for (let i = 0; i < 12; i++) { const a = i / 12 * 7; ctx.beginPath(); ctx.arc(x + Math.cos(a) * s * .34, y + Math.sin(a) * s * .34, s * .035, 0, 7); ctx.fill(); }
  } else if (type === 'peony') {
    for (let L = 0; L < 4; L++) {
      const rr = s * (1 - L * .22), n = 7 + (L % 2);
      for (let i = 0; i < n; i++) if (L > 1 || keep()) petal(ctx, x, y, rr, rr * .55, tilt + L * .4 + i * Math.PI * 2 / n, L % 2 ? lt : C);
    }
    ctx.fillStyle = dk; ctx.beginPath(); ctx.arc(x, y, s * .16, 0, 7); ctx.fill();
  } else if (type === 'tulip') {
    ctx.save(); ctx.translate(x, y); ctx.rotate(tilt * .4 + age * f.wilt * .6 * f.side);
    const h = s * 1.25, w = s * .75, open = age ? .35 * f.wilt : 0;
    const P = (cx, rot, col2) => { ctx.save(); ctx.translate(cx, 0); ctx.rotate(rot); ctx.fillStyle = col2; ctx.beginPath(); ctx.moveTo(-w * .5, h * .35); ctx.bezierCurveTo(-w * .62, -h * .1, -w * .2, -h * .55, 0, -h * .62); ctx.bezierCurveTo(w * .2, -h * .55, w * .62, -h * .1, w * .5, h * .35); ctx.closePath(); ctx.fill(); ctx.restore(); };
    if (keep()) P(-w * .25, -.18 - open, dk);
    if (keep()) P(w * .25, .18 + open, dk);
    P(0, 0, C);
    ctx.fillStyle = hexA('#ffffff', .18); ctx.beginPath(); ctx.ellipse(-w * .12, -h * .15, w * .08, h * .3, 0, 0, 7); ctx.fill();
    ctx.restore();
  } else if (type === 'sprig') {
    const n = 9;
    for (let i = 0; i < n; i++) {
      const t = i / n, px = x + Math.cos(f.tilt - Math.PI / 2) * s * 1.6 * t, py = y + Math.sin(f.tilt - Math.PI / 2) * s * 1.6 * t + age * f.wilt * t * t * s;
      ctx.fillStyle = i % 2 ? C : dk; ctx.beginPath(); ctx.ellipse(px, py, s * .13 * (1 - t * .4), s * .18 * (1 - t * .4), f.tilt, 0, 7); ctx.fill();
    }
  }
}

function paintStill(canvas, seed, later) {
  const r = mulberry32((seed * 2654435761) >>> 0), rx = mulberry32((seed * 40503 + 911) >>> 0);
  const rr = (a, b) => a + (b - a) * r(), pick = a => a[Math.floor(r() * a.length)];
  const ctx = canvas.getContext('2d'), s = canvas.width / W; ctx.setTransform(s, 0, 0, s, 0, 0);
  const age = later ? 1 : 0;
  const wall = pick(WALLS), lx = r() < .5 ? .22 : .78;
  const tags = [wall.name + ' wall'];
  // wall
  const wg = ctx.createRadialGradient(lx * W, 180, 60, lx * W, 260, 900);
  wg.addColorStop(0, wall.a); wg.addColorStop(1, wall.b);
  ctx.fillStyle = wg; ctx.fillRect(0, 0, W, H);
  const pat = r();
  if (pat < .2) { tags.push('striped'); const sw = rr(28, 60); for (let x = 0; x < W; x += sw * 2) { ctx.fillStyle = hexA('#ffffff', .05); ctx.fillRect(x, 0, sw, H); } }
  else if (pat < .4) { tags.push('dotted'); const g = rr(40, 70); ctx.fillStyle = hexA('#ffffff', .07); for (let y = g / 2; y < H; y += g) for (let x = (y / g % 2) * g / 2; x < W; x += g) { ctx.beginPath(); ctx.arc(x, y, g * .09, 0, 7); ctx.fill(); } }
  else if (pat < .55) { tags.push('lattice'); const g = rr(50, 90); ctx.strokeStyle = hexA('#000000', .12); ctx.lineWidth = 2; ctx.beginPath(); for (let k = -H; k < W + H; k += g) { ctx.moveTo(k, 0); ctx.lineTo(k + H, H); ctx.moveTo(k + H, 0); ctx.lineTo(k, H); } ctx.stroke(); }
  // table
  const ty = rr(500, 560), table = pick(['wood', 'wood', 'linen', 'check', 'marble']);
  tags.push(table);
  const front = rr(675, 715);
  if (table === 'wood') {
    const wc = pick(['#6b4428', '#4a2e1c', '#8a5a34']);
    const tg = ctx.createLinearGradient(0, ty, 0, front); tg.addColorStop(0, shade(wc, .8)); tg.addColorStop(1, wc);
    ctx.fillStyle = tg; ctx.fillRect(0, ty, W, front - ty);
    ctx.strokeStyle = hexA('#000000', .18); ctx.lineWidth = 1.2;
    for (let i = 0; i < 26; i++) { const y = rr(ty + 4, front - 4); ctx.beginPath(); ctx.moveTo(0, y); ctx.bezierCurveTo(W * .3, y + rr(-4, 4), W * .7, y + rr(-4, 4), W, y + rr(-3, 3)); ctx.stroke(); }
    ctx.fillStyle = shade(wc, .55); ctx.fillRect(0, front, W, H - front);
  } else if (table === 'linen' || table === 'check') {
    const base = table === 'linen' ? '#e6dfcf' : '#f1ece2';
    ctx.fillStyle = base; ctx.fillRect(0, ty, W, H - ty);
    if (table === 'check') {
      const cc = pick(['#c0392b', '#2f5f9e', '#3f7a4f']), g = rr(34, 50);
      ctx.fillStyle = hexA(cc, .35);
      for (let x = 0; x < W; x += g * 2) ctx.fillRect(x, ty, g, H - ty);
      for (let y = ty; y < H; y += g * 2) ctx.fillRect(0, y, W, g);
    }
    for (let i = 0; i < 9; i++) { const x = rr(0, W); const fg = ctx.createLinearGradient(x - 30, 0, x + 30, 0); fg.addColorStop(0, 'rgba(0,0,0,0)'); fg.addColorStop(.5, 'rgba(0,0,0,.09)'); fg.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = fg; ctx.fillRect(x - 30, front, 60, H - front); }
    const tg = ctx.createLinearGradient(0, ty, 0, front); tg.addColorStop(0, 'rgba(0,0,0,.12)'); tg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = tg; ctx.fillRect(0, ty, W, front - ty);
    ctx.fillStyle = 'rgba(0,0,0,.14)'; ctx.fillRect(0, front, W, 3);
  } else {
    const tg = ctx.createLinearGradient(0, ty, 0, front); tg.addColorStop(0, '#cfccc6'); tg.addColorStop(1, '#ebe8e2');
    ctx.fillStyle = tg; ctx.fillRect(0, ty, W, H - ty);
    ctx.strokeStyle = 'rgba(90,90,100,.22)'; ctx.lineWidth = 1.4;
    for (let i = 0; i < 7; i++) { let x = rr(0, W), y = rr(ty, H); ctx.beginPath(); ctx.moveTo(x, y); for (let k = 0; k < 6; k++) { x += rr(20, 70); y += rr(-14, 14); ctx.lineTo(x, y); } ctx.stroke(); }
    ctx.fillStyle = '#a9a59d'; ctx.fillRect(0, front, W, H - front);
  }
  // vase
  const vase = pick(VASES), pname = pick(Object.keys(PROFILES)), prof = PROFILES[pname];
  tags.push(vase.name + ' ' + (pname === 'tumbler' ? 'beaker' : pname));
  const cx = rr(420, 580), by = ty + rr(40, 70), hv = rr(190, 265), wv = hv * rr(.55, .8);
  const mouthY = by - hv, rm = wv * profR(prof, 1);
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(cx + (lx < .5 ? 1 : -1) * wv * .6, by + 4, wv * .9, 14, 0, 0, 7); ctx.fill();
  // fruit on the table
  const nf = Math.floor(r() * 3), fruits = [];
  for (let i = 0; i < nf; i++) fruits.push({ x: cx + (r() < .5 ? -1 : 1) * rr(wv * .9 + 40, 330), y: rr(ty + 40, front - 30), k: pick(['lemon', 'apple', 'pear', 'cherries']) });
  if (nf) tags.push(fruits.map(f => f.k).join(', '));
  // bouquet layout
  const bq = pick(BOUQUETS); tags.splice(1, 0, bq.name + ' bouquet');
  const types = [];
  const allT = ['daisy', 'poppy', 'anemone', 'peony', 'tulip', 'sprig'];
  const nt = 2 + Math.floor(r() * 3);
  while (types.length < nt) { const t = pick(allT); if (!types.includes(t)) types.push(t); }
  const dcx = cx + rr(-30, 30), dcy = mouthY - rr(120, 170), drx = rr(250, 330), dry = rr(150, 200);
  const n = 18 + Math.floor(r() * 14), flowers = [];
  for (let i = 0; i < n; i++) {
    const th = rr(-Math.PI, 0) * 1.1, u = Math.sqrt(r());
    const type = pick(types);
    const size = 1.3 * (type === 'sprig' ? rr(24, 36) : type === 'daisy' ? rr(26, 40) : type === 'peony' ? rr(40, 62) : rr(32, 52));
    const fx = dcx + Math.cos(th) * drx * u, fy = dcy + Math.sin(th) * dry * u + rr(0, dry * .55);
    flowers.push({ x: fx, y: fy, size, type, col: pick(bq.c), tilt: rr(-.5, .5), n: 14 + Math.floor(r() * 9), side: fx < cx ? -1 : 1, wilt: 0, sx: cx + rr(-rm * .6, rm * .6) });
  }
  // wilting comes from the twin's own stream, so the fresh picture never changes
  for (const f of flowers) {
    f.wilt = .4 + .6 * rx();
    if (age) { f.y += f.size * f.wilt * 1.1; f.x += f.side * f.size * .35 * f.wilt; }
  }
  flowers.sort((a, b) => a.y - b.y);
  tags.splice(2, 0, types.map(t => t === 'sprig' ? 'sprigs' : t + (t.endsWith('y') ? '' : 's')).join(' + ').replace(/ys\b/g, 'ies'));
  // greenery and stems
  const leafC = age ? '#5d6a3a' : pick(['#3f6a3a', '#4c7a3f', '#2f5a3c']);
  const nl = 30 + Math.floor(r() * 20);
  for (let i = 0; i < nl; i++) {
    const th = rr(-Math.PI * 1.05, .05), u = Math.sqrt(r());
    const lx2 = dcx + Math.cos(th) * drx * u * 1.02, ly2 = dcy + Math.sin(th) * dry * u + rr(0, dry * .5);
    const lc = age ? mix(leafC, '#8a7040', r() * .5) : shade(leafC, rr(.75, 1.25));
    petal(ctx, lx2, ly2, rr(40, 75), rr(10, 18), Math.atan2(ly2 - dcy - 40, lx2 - dcx) + rr(-.6, .6) + (age ? .5 : 0), lc);
  }
  for (const f of flowers) {
    ctx.strokeStyle = shade(leafC, .85); ctx.lineWidth = 3.2;
    ctx.beginPath(); ctx.moveTo(f.sx, mouthY + 10);
    const mx = (f.sx + f.x) / 2 + f.side * 20, my = (mouthY + f.y) / 2;
    ctx.quadraticCurveTo(mx, my, f.x, f.y); ctx.stroke();
    for (let k = 0; k < 2; k++) {
      const t = .35 + k * .25, px = (1 - t) * (1 - t) * f.sx + 2 * (1 - t) * t * mx + t * t * f.x, py = (1 - t) * (1 - t) * (mouthY + 10) + 2 * (1 - t) * t * my + t * t * f.y;
      petal(ctx, px, py, f.size * .9, f.size * .22, (k ? -1 : 1) * .9 - Math.PI / 2 + f.side * .6 + (age ? .9 * f.side : 0), k ? leafC : shade(leafC, 1.12));
    }
  }
  // vase body
  const steps = 40, pts = [];
  for (let i = 0; i <= steps; i++) { const t = i / steps; pts.push([profR(prof, t) * wv, by - t * hv]); }
  const vpath = new Path2D();
  vpath.moveTo(cx - pts[0][0], pts[0][1]);
  pts.forEach(([rad, y]) => vpath.lineTo(cx - rad, y));
  for (let i = pts.length - 1; i >= 0; i--) vpath.lineTo(cx + pts[i][0], pts[i][1]);
  vpath.closePath();

const SKIES = [

function cumulus(ctx, rx, base, alpha) {

function paintField(canvas, seed, topped) {
  const r = mulberry32((seed * 2654435761) >>> 0), rx = mulberry32((seed * 40503 + 77) >>> 0), rt = mulberry32((seed * 7919 + 5) >>> 0);

// ---------- layout & rendering ----------

// ---------- scatter ----------

// ---------- interaction ----------

  G.started = 0; G.elapsed = 0; G.peeks = 0; G.done = false; G.reveal = null; G.drag = null; G.didTurn = false;
  buildPuzzle(); layout(); scatter(true); status(); tick();
  cvs.setAttribute('aria-label', `Jigsaw of ${G.kind === 'field' ? 'tulip field' : 'still life'} number ${G.seed}, ${G.n} pieces${G.turned ? ', pieces turned' : ''}. Drag pieces into the frame${G.turned ? '; tap a piece to turn it' : ''}.`);
}

function pressed(ids, on) { ids.forEach(id => document.getElementById(id).setAttribute('aria-pressed', id === on)); }
document.getElementById('c-today').onclick = () => { G.today = true; pressed(['c-today', 'c-random'], 'c-today'); newGame(); };
document.getElementById('c-random').onclick = () => { G.today = false; pressed(['c-today', 'c-random'], 'c-random'); newGame(); };
document.getElementById('k-still').onclick = () => { G.kind = 'still'; pressed(['k-still', 'k-field'], 'k-still'); newGame(); };
document.getElementById('k-field').onclick = () => { G.kind = 'field'; pressed(['k-still', 'k-field'], 'k-field'); newGame(); };
document.getElementById('t-night').onclick = () => { G.day = false; pressed(['t-night', 't-day'], 't-night'); newGame(); };
document.getElementById('t-day').onclick = () => { G.day = true; pressed(['t-night', 't-day'], 't-day'); newGame(); };
const sizes = document.getElementById('sizes');
function buildSizes() {
  sizes.innerHTML = '';
  const keys = Object.keys(sizesFor()).map(Number);
  if (!keys.includes(G.n)) G.n = keys.reduce((a, b) => Math.abs(b - G.n) < Math.abs(a - G.n) ? b : a);
  keys.forEach(n => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = n;
    b.setAttribute('aria-pressed', n === G.n); b.setAttribute('aria-label', n + ' pieces');
    b.onclick = () => { G.n = n; sizes.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); newGame(); };
    sizes.appendChild(b);
  });
}
document.getElementById('m-up').onclick = () => { G.turned = false; pressed(['m-up', 'm-turn'], 'm-up'); buildSizes(); newGame(); };
document.getElementById('m-turn').onclick = () => { G.turned = true; pressed(['m-up', 'm-turn'], 'm-turn'); buildSizes(); newGame(); };
buildSizes();
const peek = document.getElementById('peek');
const peekOn = e => { e.preventDefault(); if (G.done || G.peeking) return; G.peeking = true; G.peeks++; peek.classList.add('on'); status(); draw(); };
const peekOff = () => { if (!G.peeking) return; G.peeking = false; peek.classList.remove('on'); draw(); };
peek.addEventListener('pointerdown', peekOn);
peek.addEventListener('pointerup', peekOff); peek.addEventListener('pointerleave', peekOff); peek.addEventListener('pointercancel', peekOff);
peek.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') peekOn(e); });
peek.addEventListener('keyup', peekOff);
document.getElementById('spread').onclick = () => { if (!G.done) scatter(false); };

let rz = 0;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => {
  layout(); for (const g of G.groups.values()) if (!g.locked && !g.slotted) clampGroup(g); draw();
}, 150); });

newGame();
</script>
